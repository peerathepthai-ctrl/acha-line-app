<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.CHA Clothes Shop - สั่งทำเสื้อ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #0f0f0f; color: #fff; }</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-neutral-900 border border-amber-500/40 rounded-3xl p-8 shadow-2xl">
        <div class="w-20 h-20 bg-amber-500/10 border-2 border-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 text-amber-500 text-3xl">
            <i class="fa-solid fa-shirt"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">A.CHA Clothes Shop</h1>
        <p class="text-gray-400 text-sm mb-8">ระบบสั่งทำเสื้อยูนิฟอร์มและปักผ้าพรีเมียม พร้อมเปิดให้บริการแล้ว</p>
        
        <button onclick="loginAsCustomer()" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-3 text-lg shadow-lg mb-4 transition transform hover:scale-105">
            <i class="fa-brands fa-line text-2xl"></i>
            <span>เข้าสู่ระบบสั่งตัดเสื้อ</span>
        </button>

        <button onclick="loginAsAdmin()" class="w-full bg-neutral-800 hover:bg-neutral-700 text-amber-400 font-semibold py-3 rounded-xl border border-amber-500/30 text-sm transition">
            <i class="fa-solid fa-user-shield mr-2"></i>เข้าสู่ระบบผู้จัดการร้าน (Admin)
        </button>
    </div>

    <script>
        function loginAsCustomer() {
            alert('ยินดีต้อนรับคุณลูกค้าเข้าสู่ระบบ A.CHA ครับ!');
            location.href = 'https://acha-line-app.onrender.com';
        }
        function loginAsAdmin() {
            const pass = prompt('กรุณากรอกรหัสผ่าน Admin:');
            if (pass === '231165') {
                alert('เข้าสู่ระบบ Admin สำเร็จ!');
            } else if (pass !== null) {
                alert('รหัสผ่านไม่ถูกต้อง');
            }
        }
    </script>
</body>
</html>
